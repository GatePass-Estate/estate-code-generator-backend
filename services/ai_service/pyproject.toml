[tool.poetry]
name = "ai-service"
version = "0.1.0"
description = "AI service: visit anomaly detection and incident report intelligence"
authors = ["GatePass"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
gatepass-auth = {path = "../shared/gatepass_auth", develop = true}
fastapi = "^0.115.4"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.2"
pydantic-settings = "^2.6.1"
httpx = "^0.27.2"
numpy = "^2.0.0"
pyjwt = "^2.12.1"
pandas = "^3.0.2"
scikit-learn = ">=1.5,<2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
# ``sys.path`` is adjusted before ``app.*`` imports (see module docstring).
"app/pipeline/anomaly_orchestration.py" = ["E402"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
