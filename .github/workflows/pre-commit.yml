name: Python Style Commit Checks
on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "*" ]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: pre-commit/action@v3.0.0
