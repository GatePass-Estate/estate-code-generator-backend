upstream code_service    { server 127.0.0.1:9033; }
upstream user_service    { server 127.0.0.1:9034; }
upstream ai_service      { server 127.0.0.1:9036; }
upstream revenue_service { server 127.0.0.1:9037; }

server {
    listen 8080;

    # ── Public routes (same paths as the Cloud LB URL map) ──
    location /code/ {
        proxy_pass http://code_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/ {
        proxy_pass http://ai_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /revenue/ {
        proxy_pass http://revenue_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check for Cloud Run ──
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Block everything else ──
    location / {
        return 404;
    }
}
