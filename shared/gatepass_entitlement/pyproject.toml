[tool.poetry]
name = "gatepass-entitlement"
version = "0.1.0"
description = "Shared revenue-service entitlement checks for GatePass services"
authors = ["GatePass"]
packages = [{ include = "gatepass_entitlement" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.4"
httpx = ">=0.27.2"
pydantic-settings = ">=2.6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
