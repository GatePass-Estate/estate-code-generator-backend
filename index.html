<!doctype html>

    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Activate Your Account - Gate Pass</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"

    />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Responsive styles */
      @media only screen and (max-width: 620px) {
        .wrapper {
          padding: 110px 31px 16px 31px !important;
        }
        .content {
          max-width: 100% !important;
        }
        .logo {
          padding-bottom: 17px !important;
        }
        .logo img {
          width: 166px !important;
          height: 68px !important;
          max-width: 166px !important;
        }
        .heading {
          font-size: 21px !important;
        }
        .heading-cell {
          padding-left: 16px !important;
          padding-right: 16px !important;
          padding-bottom: 33px !important;
        }
        .button {
          width: 100% !important;
          max-width: 100% !important;
          height: 33px !important;
          line-height: 23px !important;
          font-size: 14px !important;
        }
        .body-text {
          font-size: 12px !important;
        }
        .body-text.instruction-text {
          margin-bottom: 27px !important;
          line-height: 14px !important;
        }
        .content-group {
          padding-left: 16px !important;
        }
        .content-group .body-text {
          font-weight: 500 !important;
        }
        .button-cell {
          padding-bottom: 27px !important;
        }
      }
    </style>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family:
        &quot;Ubuntu Sans&quot;,
        Ubuntu,
        -apple-system,
        BlinkMacSystemFont,
        &quot;Segoe UI&quot;,
        sans-serif;

    <table

      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #ffffff"
    >
      <tr>
        <td align="center" class="wrapper" style="padding: 164px 20px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            class="content"
            style="max-width: 600px; margin: 0 auto"
          >
            <!-- Logo -->
            <tr>
              <td align="left" class="logo" style="padding-bottom: 27px">
                <img
                  src="https://res.cloudinary.com/dnhdh9rub/image/upload/v1773781599/gatepass_ng_Gate_Pass_1_kqxzkp.svg"
                  width="254"
                  height="104"
                  alt="Gate Pass"
                  style="display: block; max-width: 100%; height: auto"
                />
              </td>
            </tr>
            <!-- Main Heading -->
            <tr>
              <td
                align="left"
                class="heading-cell"
                style="
                  padding-bottom: 27px;
                  padding-left: 30px;
                  padding-right: 30px;
                "
              >
                <h1
                  class="heading"
                  style="
                    margin: 0;
                    font-size: 50px;
                    font-weight: 600;
                    color: #113e55;
                    font-family:
                      &quot;Ubuntu Sans&quot;,
                      Ubuntu,
                      -apple-system,
                      BlinkMacSystemFont,
                      &quot;Segoe UI&quot;,
                      sans-serif;
                  "
                >
                  Activate Your Account
                </h1>
              </td>
            </tr>
            <!-- Body Content -->
            <tr>
              <td
                class="content-group"
                style="
                  padding: 0 16px 0px 16px;
                  padding-left: 36px;
                  font-family:
                    &quot;Inter&quot;,
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                "
              >
                <p
                  class="body-text"
                  style="
                    margin: 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #172024;
                    text-align: left;
                    font-family:
                      &quot;Inter&quot;,
                      -apple-system,
                      BlinkMacSystemFont,
                      sans-serif !important;
                  "
                >
                  Hi User1245,
                </p>
                <p
                  class="body-text instruction-text"
                  style="
                    margin: 27px 0 62px 0;
                    font-size: 16px;
                    line-height: 18px;
                    color: #172024;
                    text-align: left;
                    font-family:
                      &quot;Inter&quot;,
                      -apple-system,
                      BlinkMacSystemFont,
                      sans-serif !important;
                  "
                >
                  Please verify your email address by clicking the link to
                  Gatepassng.com. You will be prompted to also set your password
                  to complete account activation.
                </p>
              </td>
            </tr>
            <!-- CTA Button -->
            <tr>
              <td
                align="left"
                class="button-cell content-group"
                style="padding-bottom: 71px; padding-left: 36px"
              >
                <!-- Replace # with your activation URL, e.g. https://gatepass.com/activate?token=USER_TOKEN -->
                <a
                  href="#"
                  class="button"
                  style="
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    width: 100%;
                    max-width: 526px;
                    height: 54px;
                    padding: 0;
                    background-color: #113e55;
                    color: #ffffff;
                    font-size: 16px;
                    font-weight: 600;
                    text-decoration: none;
                    border-radius: 8px;
                    font-family:
                      &quot;Ubuntu Sans&quot;,
                      Ubuntu,
                      -apple-system,
                      BlinkMacSystemFont,
                      &quot;Segoe UI&quot;,
                      sans-serif;
                    box-sizing: border-box;
                  "
                >
                  Activate Your Account
                </a>
              </td>
            </tr>
            <!-- Closing -->
            <tr>
              <td class="content-group" style="padding-left: 36px">
                <p
                  class="body-text"
                  style="
                    margin: 0;
                    font-size: 16px;
                    line-height: 1.6;
                    color: #172024;
                    text-align: left;
                    font-family:
                      &quot;Inter&quot;,
                      -apple-system,
                      BlinkMacSystemFont,
                      sans-serif !important;
                  "
                >
                  Thanks,<br />
                  GatePass Team
                </p>
              </td>
            </tr>
          </table>
        </td>
